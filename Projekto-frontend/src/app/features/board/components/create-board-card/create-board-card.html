<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<div class="bg-background-light font-display min-h-screen flex items-center justify-center p-4">
  <!-- Modal Overlay Backdrop -->
  <div class="fixed inset-0 bg-overlay flex items-center justify-center z-50">
    <!-- Modal Container -->
    <div class="bg-white w-full max-w-[520px] rounded-xl shadow-2xl overflow-hidden flex flex-col">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
        <h2 class="text-xl font-bold text-slate-900">Create Board</h2>
        <button class="text-slate-400 hover:text-slate-600 transition-colors">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Form Content -->
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="p-6 space-y-6 overflow-y-auto max-h-[80vh]">
          <!-- Board Name Input -->
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-700">Board Name</label>
            <input
              class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-white text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400"
              placeholder="e.g., Q4 Marketing Campaign"
              formControlName="name"
              type="text"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-700">Board Description</label>
            <input
              class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-white text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-slate-400"
              placeholder="e.g., This is for...."
              formControlName="description"
              type="text"
            />
          </div>

          <!-- Visibility Toggle -->
          <div class="space-y-3">
            <label class="block text-sm font-semibold text-slate-700">Visibility</label>

            <div class="grid grid-cols-2 gap-3">
              <label class="cursor-pointer">
                <input
                  checked
                  class="peer sr-only"
                  name="visibility"
                  type="radio"
                  value="workspace"
                  [defaultChecked]="true"
                  formControlName="isWorkspace"
                />
                <div
                  class="flex flex-col p-3 rounded-lg border border-slate-200 peer-checked:border-primary peer-checked:bg-primary/5 transition-all"
                >
                  <div class="flex items-center gap-2 mb-1">
                    <span
                      class="material-symbols-outlined text-sm text-slate-500 peer-checked:text-primary"
                    >
                      groups
                    </span>
                    <span class="text-sm font-medium text-slate-900">Workspace</span>
                  </div>
                  <p class="text-xs text-slate-500">Everyone can see this board.</p>
                </div>
              </label>

              <label class="cursor-pointer">
                <input
                  class="peer sr-only"
                  name="visibility"
                  type="radio"
                  value="private"
                />
                <div
                  class="flex flex-col p-3 rounded-lg border border-slate-200 peer-checked:border-primary peer-checked:bg-primary/5 transition-all"
                >
                  <div class="flex items-center gap-2 mb-1">
                    <span
                      class="material-symbols-outlined text-sm text-slate-500 peer-checked:text-primary"
                    >
                      lock
                    </span>
                    <span class="text-sm font-medium text-slate-900">Private</span>
                  </div>
                  <p class="text-xs text-slate-500">Only you can see this board.</p>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div
          class="px-6 py-5 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-3"
        >
          <button
            class="px-5 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-200 transition-colors"
          >
            Cancel
          </button>

          <button
            class="relative px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-primary hover:bg-primary/90 transition-all flex items-center gap-2 shadow-lg shadow-primary/20 group"
            type="submit"
          >
            <span class="group-active:opacity-0 transition-opacity">Create Board</span>
            <div
              class="absolute inset-0 flex items-center justify-center opacity-0 group-active:opacity-100"
            >
              <svg
                class="animate-spin h-5 w-5 text-white"
                fill="none"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                  fill="currentColor"
                ></path>
              </svg>
            </div>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
