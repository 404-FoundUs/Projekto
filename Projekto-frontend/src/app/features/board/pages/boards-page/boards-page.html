<div class="bg-white text-[#111318] min-h-screen">
  <!-- Main Container -->
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <app-side-navigationbar-board></app-side-navigationbar-board>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">

      <!-- Header -->
      <app-board-header></app-board-header>

      <!-- Board Content -->
      <div class="px-8 pb-12">

        <!-- Recent Boards -->
        <section class="mt-8">
          <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined text-blue-600">history</span>
            Recent Boards
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

            <!-- Create New Board -->
            <button
              class="group relative flex flex-col items-center justify-center h-48 border-2 border-dashed border-gray-300 rounded-xl hover:border-blue-600 hover:bg-blue-50 transition-all"
            >
              <div
                class="size-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform"
              >
                <span class="material-symbols-outlined font-bold text-3xl">add</span>
              </div>
              <span class="font-semibold text-gray-600 group-hover:text-blue-600">
                Create New Board
              </span>
            </button>

            <app-board-card></app-board-card>
            <app-board-card></app-board-card>

          </div>
        </section>

        <!-- Pinned Boards -->
        <section class="mt-12">
          <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined text-yellow-500">star</span>
            Pinned Boards
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

            <div
              class="group relative flex flex-col bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all cursor-pointer"
            >
              <div class="flex justify-between items-start mb-4">
                <div
                  class="size-10 rounded-lg bg-orange-100 flex items-center justify-center text-orange-600"
                >
                  <span class="material-symbols-outlined">architecture</span>
                </div>
                <button class="text-yellow-400">
                  <span class="material-symbols-outlined">star</span>
                </button>
              </div>

              <h3 class="font-bold text-base mb-1">Design System</h3>
              <p class="text-xs text-gray-500 mb-6">Updated 3 days ago</p>

              <div class="mt-auto flex items-center justify-between">
                <span
                  class="px-2 py-0.5 rounded text-[10px] font-bold bg-gray-100 text-gray-600"
                >
                  CORE
                </span>
              </div>
            </div>

          </div>
        </section>

        <!-- All Boards -->
        <section class="mt-12">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2">
              <span class="material-symbols-outlined text-gray-500">
                format_list_bulleted
              </span>
              All Boards
            </h2>

            <div class="flex items-center gap-2">
              <div class="flex bg-gray-100 rounded-lg p-1">
                <button class="p-1.5 rounded bg-white shadow-sm text-blue-600">
                  <span class="material-symbols-outlined text-xl">grid_view</span>
                </button>
                <button class="p-1.5 rounded text-gray-400 hover:text-gray-600">
                  <span class="material-symbols-outlined text-xl">list</span>
                </button>
              </div>

              <button
                class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors"
              >
                <span class="material-symbols-outlined text-lg">sort</span>
                Sort by Date
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

            <div
              class="group relative flex flex-col bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all cursor-pointer"
            >
              <div class="flex justify-between items-start mb-4">
                <div
                  class="size-10 rounded-lg bg-indigo-100 flex items-center justify-center text-indigo-600"
                >
                  <span class="material-symbols-outlined">analytics</span>
                </div>
                <button class="text-gray-300 hover:text-yellow-400">
                  <span class="material-symbols-outlined">star</span>
                </button>
              </div>
              <h3 class="font-bold text-base mb-1">Customer Research</h3>
              <p class="text-xs text-gray-500">12 Boards</p>
            </div>

          </div>
        </section>

      </div>
    </main>
  </div>
</div>
