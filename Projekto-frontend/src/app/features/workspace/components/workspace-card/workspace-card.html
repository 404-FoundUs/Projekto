<div
  class="bg-white border border-gray-200 rounded-xl p-6 flex flex-col gap-6 hover:shadow-xl hover:-translate-y-1 transition-all group"
>
  <div class="flex justify-between items-start">
    <div class="size-14 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center">
      <span class="material-symbols-outlined text-[28px]">
        {{ icon }}
      </span>
    </div>

    <button class="text-gray-400 hover:text-gray-600">
      <span class="material-symbols-outlined">more_vert</span>
    </button>
  </div>

  <div>
    <h3 class="text-xl font-bold text-[#111318] mb-1">
      {{ workspace.name }}
    </h3>
    <p class="text-gray-500 text-sm line-clamp-1">
      {{ workspace.description }}
    </p>
  </div>

  <div class="flex items-center gap-4 mt-auto">
    <div class="flex items-center gap-1.5 text-gray-600">
      <span class="material-symbols-outlined text-[18px]">group</span>
      <span class="text-xs font-semibold">
        {{ workspace.memberIds.length }}
      </span>
    </div>

    <div class="flex items-center gap-1.5 text-gray-600">
      <span class="material-symbols-outlined text-[18px]">folder</span>
      <span class="text-xs font-semibold">
        {{ workspace.projectCount }}
      </span>
    </div>
  </div>

  <button
    class="w-full py-2.5 bg-gray-50 text-gray-700 rounded-lg font-semibold
           group-hover:bg-primary group-hover:text-white transition-colors"
    [routerLink]="['/workspaces/board', workspace.id]"
  >
    Enter Workspace
  </button>
</div>
