<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<div class="flex h-screen overflow-hidden">
  <!-- Side Navigation Bar -->
  <app-side-navigationbar-dashboard></app-side-navigationbar-dashboard>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-y-auto">
    <!-- Page Header -->
    <header class="p-8 pb-0">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <h2 class="text-[#111318] text-4xl font-black leading-tight tracking-tight">Workspaces</h2>

        <div class="flex items-center gap-3">
          <button
            class="bg-primary text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 hover:bg-blue-700 transition-colors shadow-sm"
            routerLink="/workspaces/create-workspace"
          >
            <span class="material-symbols-outlined text-[20px]">add</span>
            New Workspace
          </button>
        </div>
      </div>

      <!-- Controls: Search & Filters -->
      <div class="flex flex-col md:flex-row gap-4 items-center">
        <div class="flex-1 w-full">
          <label class="flex flex-col min-w-40 h-11 w-full">
            <div class="flex w-full flex-1 items-stretch rounded-lg h-full border border-gray-200">
              <div
                class="text-[#616f89] flex bg-white items-center justify-center pl-4 rounded-l-lg"
                data-icon="search"
              >
                <span class="material-symbols-outlined">search</span>
              </div>

              <input
                class="form-input flex w-full min-w-0 flex-1 border-none bg-white text-[#111318] focus:ring-0 h-full placeholder:text-[#616f89] px-4 rounded-r-lg text-base font-normal"
                placeholder="Search workspaces..."
                value=""
              />
            </div>
          </label>
        </div>

        <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
          <button
            class="flex h-11 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white border border-gray-200 px-4 hover:border-primary transition-colors"
          >
            <p class="text-[#111318] text-sm font-medium">Sort by Name</p>
            <span class="material-symbols-outlined text-[18px]">expand_more</span>
          </button>

          <button
            class="flex h-11 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white border border-gray-200 px-4 hover:border-primary transition-colors"
          >
            <p class="text-[#111318] text-sm font-medium">Recently Viewed</p>
            <span class="material-symbols-outlined text-[18px]">expand_more</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Workspace Grid -->
    <section class="p-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Create New Card -->
        <div
          class="rounded-xl p-6 flex flex-col gap-6 hover:shadow-xl hover:-translate-y-1 transition-all group cursor-pointer border-2 border-dashed border-gray-300 hover:border-primary items-center justify-center bg-transparent hover:bg-blue-50/50"
        >
          <!-- TODO: routing issue and dialog box issue  -->
          <div
            class="bg-primary/10 text-primary rounded-full size-16 flex items-center justify-center group-hover:scale-110 transition-transform"
            [routerLink]="['/workspaces', 'create']"
          >
            <span class="material-symbols-outlined text-[32px]">add</span>
          </div>
          <p class="text-primary font-bold text-lg">Create Workspace</p>
        </div>
        <app-workspace-card *ngFor="let ws of workspace; trackBy: trackById" [workspace]="ws">
        </app-workspace-card>
      </div>
    </section>
  </main>
</div>
