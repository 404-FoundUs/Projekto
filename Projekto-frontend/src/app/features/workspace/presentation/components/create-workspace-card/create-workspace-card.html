<script id="tailwind-config">
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          primary: '#135bec',
          'background-light': '#f6f6f8',
          'background-dark': '#101622',
        },
        fontFamily: {
          display: ['Inter', 'sans-serif'],
        },
        borderRadius: {
          DEFAULT: '0.25rem',
          lg: '0.5rem',
          xl: '0.75rem',
          full: '9999px',
        },
      },
    },
  };
</script>

<div class="bg-background-light min-h-screen flex items-center justify-center p-4">
  <!-- Modal Overlay Backdrop -->
  <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-0"></div>

  <!-- Modal Container -->
  <div
    class="relative z-10 w-full max-w-[640px] bg-white shadow-2xl rounded-xl overflow-hidden flex flex-col"
  >
    <!-- Header -->
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="px-8 pt-8 pb-4 flex justify-between items-start">
        <div class="flex flex-col gap-1">
          <h1 class="text-[#111318] text-2xl font-bold leading-tight">Create your workspace</h1>
          <p class="text-[#616f89] text-sm font-normal">
            Workspaces are where your team manages projects and tasks.
          </p>
        </div>
        <button
          type="button"
          class="text-[#616f89] hover:bg-gray-100 p-2 rounded-full transition-colors"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Form Content -->
      <div class="px-8 py-2 overflow-y-auto max-h-[70vh] space-y-4">
        <!-- Workspace Name -->
        <div class="flex flex-col gap-2">
          <label class="text-[#111318] text-sm font-semibold">
            Workspace Name <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="name"
            placeholder="e.g., Marketing Team"
            class="w-full rounded-lg text-[#111318] border border-[#dbdfe6] bg-white focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-sm transition-all"
          />
          <p *ngIf="isControlInvalid('name')" class="text-red-500 text-xs mt-1">
            Workspace name is required
          </p>
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-2">
          <label class="text-[#111318] text-sm font-semibold">Description (Optional)</label>
          <textarea
            formControlName="description"
            placeholder="What's this workspace about?"
            class="w-full rounded-lg text-[#111318] border border-[#dbdfe6] bg-white focus:border-primary focus:ring-1 focus:ring-primary min-h-[100px] p-4 text-sm resize-none"
          ></textarea>
          <p *ngIf="isControlInvalid('description')" class="text-red-500 text-xs mt-1">
            Workspace description is required
          </p>
        </div>

        <!-- Workspace Privacy Toggle -->
        <div class="pt-2">
          <div
            class="flex items-center justify-between gap-4 rounded-lg border border-[#dbdfe6] bg-white p-4"
          >
            <div class="flex gap-3 items-center">
              <div
                class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary"
              >
                <span class="material-symbols-outlined">lock</span>
              </div>
              <div class="flex flex-col">
                <p class="text-[#111318] text-sm font-bold">Workspace Privacy</p>
                <p class="text-[#616f89] text-xs">
                  Private workspaces are only visible to invited members.
                </p>
              </div>
            </div>

            <label
              class="relative flex h-[28px] w-[48px] cursor-pointer items-center rounded-full bg-gray-200 p-1 transition-colors"
            >
              <input type="checkbox" formControlName="isPrivate" class="sr-only peer" />
              <div
                class="h-5 w-5 rounded-full bg-white shadow-md transition-transform peer-checked:translate-x-5"
              ></div>
            </label>
          </div>
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="px-8 py-6 border-t border-[#dbdfe6] mt-4 bg-gray-50/50 flex justify-end gap-3">
        <button
          type="button"
          class="px-6 py-2.5 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-8 py-2.5 rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all"
        >
          Create Workspace
        </button>
      </div>
    </form>
  </div>
</div>
