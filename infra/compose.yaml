# Use postgres/example user/password credentials
services:
  postgres_db:
    image: postgres:16
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    env_file:
      - .././env/database.env
    ports:
      - 5432:5432
    volumes:       
      - ./data/postgres/:/var/lib/postgresql/data/
    # volumes:
      # - type: tmpfs
