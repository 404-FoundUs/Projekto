  angular-dev:
    build:
      context: ./../Projekto-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
  angular-test:
    build:
      context: ./../Projekto-frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "test"]


  db:
    image: postgres:latest
    container_name: postgres-db
    ports:
      # - "${POSTGRES_PORT:-5432}:5432"   # bind to localhost only
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # bind to localhost only
      
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      # - ./init-scripts:/docker-entrypoint-initdb.d:ro  # optional seed scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s             # grace period before health checks begin
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local